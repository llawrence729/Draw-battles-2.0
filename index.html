<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Draw</title>
<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#1a1a1a}#load-error{color:#b91c1c}</style>
</head>
<body>
<p id="load-status">Loading Battle Draw…</p>
<p id="load-error" hidden>Battle Draw could not be loaded. Please check your internet connection and reload.</p>
<script>
(async()=>{
  const sourceUrl='https://raw.githubusercontent.com/llawrence729/Draw-battles-2.0/06f33d5a17ee94b87bce33ca00d3782e78722ae8/index.html';
  try{
    const response=await fetch(sourceUrl);
    if(!response.ok) throw new Error('Current game source unavailable');
    let html=await response.text();
    const naoyaEnhancements=`
CATALOG.special.push(make('key','Key','🔑',4200,680,80,20,4,24));
const stepWithNaoyaEnhancements=step;
step=function(){
  const previousPositions=new Map();
  if(running) for(const unit of units) if(unit.id==='naoya-zenin'&&unit.hp>0) previousPositions.set(unit,{x:unit.x,y:unit.y});
  stepWithNaoyaEnhancements();
  if(!running) return;
  for(const unit of units){
    if(unit.id!=='naoya-zenin'||unit.hp<=0) continue;
    unit.naoyaGrowthTimer=(unit.naoyaGrowthTimer||0)+1;
    if(unit.naoyaGrowthTimer>=60){
      unit.naoyaGrowthTimer=0;
      unit.naoyaGrowthCount=(unit.naoyaGrowthCount||0)+1;
      unit.dmg*=1.08;
      const gainedHp=unit.maxHp*.04;
      unit.maxHp+=gainedHp;
      unit.hp=Math.min(unit.maxHp,unit.hp+gainedHp*.5);
      unit.naoyaBaseSpeed=Math.min(10,(unit.naoyaBaseSpeed||unit.speed)+.08);
    }
    if(!unit.naoyaHitCooldowns) unit.naoyaHitCooldowns=new Map();
    for(const [enemy,timer] of unit.naoyaHitCooldowns){
      if(timer<=1) unit.naoyaHitCooldowns.delete(enemy);
      else unit.naoyaHitCooldowns.set(enemy,timer-1);
    }
    if(unit.naoyaFrenzyFrames>0){
      unit.naoyaFrenzyFrames--;
    }else{
      unit.naoyaFrenzyCooldown=(unit.naoyaFrenzyCooldown??1800)-1;
      if(unit.naoyaFrenzyCooldown<=0){
        unit.naoyaFrenzyFrames=180;
        unit.naoyaFrenzyCooldown=1800;
        unit.naoyaWaypoint={x:16+Math.random()*Math.max(1,W-32),y:16+Math.random()*Math.max(1,H-32)};
        spawnParticles(unit.x,unit.y,'#38bdf8',36,8,36);
      }
    }
    const wasFrenzy=unit.naoyaFrenzyFrames>0;
    const start=previousPositions.get(unit)||{x:unit.x,y:unit.y};
    if(wasFrenzy){
      if(!unit.naoyaWaypoint) unit.naoyaWaypoint={x:16+Math.random()*Math.max(1,W-32),y:16+Math.random()*Math.max(1,H-32)};
      let dx=unit.naoyaWaypoint.x-unit.x,dy=unit.naoyaWaypoint.y-unit.y,distance=Math.hypot(dx,dy);
      if(distance<18){
        unit.naoyaWaypoint={x:16+Math.random()*Math.max(1,W-32),y:16+Math.random()*Math.max(1,H-32)};
        dx=unit.naoyaWaypoint.x-unit.x;dy=unit.naoyaWaypoint.y-unit.y;distance=Math.hypot(dx,dy);
      }
      const runSpeed=26+Math.min(22,(unit.naoyaGrowthCount||0)*.35);
      if(distance>0){unit.x+=dx/distance*Math.min(runSpeed,distance);unit.y+=dy/distance*Math.min(runSpeed,distance);}
      unit.x=Math.max(12,Math.min(W-12,unit.x));unit.y=Math.max(12,Math.min(H-12,unit.y));
      const vx=unit.x-start.x,vy=unit.y-start.y,length2=vx*vx+vy*vy;
      for(const enemy of units){
        if(enemy.team===unit.team||enemy.hp<=0||unit.naoyaHitCooldowns.has(enemy)) continue;
        const t=length2?Math.max(0,Math.min(1,((enemy.x-start.x)*vx+(enemy.y-start.y)*vy)/length2)):0;
        const nearX=start.x+t*vx,nearY=start.y+t*vy;
        if(Math.hypot(enemy.x-nearX,enemy.y-nearY)<=unit.size+enemy.size+12){
          enemy.hp=Math.max(0,enemy.hp-Math.max(600,unit.dmg*8));
          enemy.paralyzed=Math.max(enemy.paralyzed||0,120);
          unit.naoyaHitCooldowns.set(enemy,18);
          spawnParticles(enemy.x,enemy.y,'#38bdf8',20,6,24);
        }
      }
    }else if(unit.naoyaDashPhase==='out'){
      const enemy=nearest(units,unit.x,unit.y,other=>other.team!==unit.team&&other.hp>0);
      if(enemy){
        let dx=unit.x-enemy.x,dy=unit.y-enemy.y,distance=Math.hypot(dx,dy);
        if(distance<1){dx=-(unit.facing||1);dy=0;distance=1;}
        const dashDistance=8+Math.min(10,(unit.naoyaGrowthCount||0)*.2);
        unit.x=Math.max(12,Math.min(W-12,unit.x+dx/distance*dashDistance));
        unit.y=Math.max(12,Math.min(H-12,unit.y+dy/distance*dashDistance));
      }
    }
    if(wasFrenzy||unit.naoyaDashPhase==='out'){
      unit.naoyaTrail=unit.naoyaTrail||[];
      unit.naoyaTrail.push({x:unit.x,y:unit.y});
      if(unit.naoyaTrail.length>24) unit.naoyaTrail.shift();
    }
  }
};
const renderWithNaoyaEnhancements=render;
render=function(){
  renderWithNaoyaEnhancements();
  for(const unit of units){
    if(unit.id!=='naoya-zenin'||unit.hp<=0||unit.naoyaFrenzyFrames<=0) continue;
    ctx.save();ctx.beginPath();ctx.arc(unit.x,unit.y,unit.size+12,0,Math.PI*2);
    ctx.strokeStyle='#38bdf8';ctx.lineWidth=4;ctx.shadowColor='#38bdf8';ctx.shadowBlur=22;ctx.stroke();ctx.restore();
  }
};
const projectileNameByType={bullet:'Bullet',arrow:'Arrow',grenade:'Grenade',shell:'Shell',mortar:'Mortar',fire:'Fireball',aplus:'A+',sukunaSlash:'Slash',sukunaFire:'Fuga',gojoBlue:'Blue',gojoRed:'Red',hollowPurple:'Hollow Purple'};
const fireWithProjectileLabels=fire;
fire=function(unit,target){
  const previousCount=projectiles.length;
  fireWithProjectileLabels(unit,target);
  const projectile=projectiles[previousCount];
  if(!projectile) return;
  const label=unit.nextShotLabel||projectile.label||projectileNameByType[unit.proj]||unit.projectileLabel||unit.name||'Shot';
  projectile.label=String(label).slice(0,28);
  projectile.labelColor=projectile.color||'#374151';
  projectile.trail=[];
};
const stepWithProjectileTrails=step;
step=function(){
  stepWithProjectileTrails();
  for(const projectile of projectiles){
    if(!Number.isFinite(projectile.x)||!Number.isFinite(projectile.y)) continue;
    if(!projectile.trail) projectile.trail=[];
    const last=projectile.trail[projectile.trail.length-1];
    if(!last||Math.hypot(projectile.x-last.x,projectile.y-last.y)>2){
      projectile.trail.push({x:projectile.x,y:projectile.y,z:projectile.z||0});
      if(projectile.trail.length>7) projectile.trail.shift();
    }
  }
};
const renderWithProjectileLabels=render;
render=function(){
  renderWithProjectileLabels();
  for(const projectile of projectiles){
    if(!Number.isFinite(projectile.x)||!Number.isFinite(projectile.y)) continue;
    const lift=projectile.z||0;
    const color=projectile.labelColor||projectile.color||'#4b5563';
    ctx.save();
    const trail=projectile.trail||[];
    if(trail.length>1){
      ctx.beginPath();
      for(let i=0;i<trail.length;i++){
        const point=trail[i],py=point.y-(point.z||lift);
        if(i===0) ctx.moveTo(point.x,py); else ctx.lineTo(point.x,py);
      }
      ctx.globalAlpha=.3;ctx.strokeStyle=color;ctx.lineWidth=4;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
    }
    const text=projectile.label||'Shot';
    ctx.globalAlpha=1;ctx.font='bold 11px system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const width=Math.min(150,ctx.measureText(text).width+14),height=20;
    const labelX=projectile.x,labelY=projectile.y-lift-19;
    ctx.shadowColor='rgba(0,0,0,.24)';ctx.shadowBlur=4;ctx.shadowOffsetY=1;
    ctx.fillStyle='rgba(255,255,255,.97)';ctx.strokeStyle=color;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.rect(labelX-width/2,labelY-height/2,width,height);ctx.fill();ctx.stroke();
    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
    ctx.fillStyle='#111827';ctx.fillText(text,labelX,labelY,width-8);
    ctx.restore();
  }
};
`;
    const insertion=html.lastIndexOf('\n`;');
    if(insertion<0) throw new Error('Game extension point unavailable');
    html=html.slice(0,insertion)+'\n'+naoyaEnhancements+html.slice(insertion);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('load-status').hidden=true;
    document.getElementById('load-error').hidden=false;
    console.error(error);
  }
})();
</script>
</body>
</html>
