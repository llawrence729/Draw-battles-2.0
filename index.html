<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Draw</title>
<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#1a1a1a}#load-error{color:#b91c1c}</style>
</head>
<body>
<p id="load-status">Loading Battle Draw…</p>
<p id="load-error" hidden>Battle Draw could not be loaded. Please check your internet connection and reload.</p>
<script>
(async()=>{
  const previousUrl='https://raw.githubusercontent.com/llawrence729/Draw-battles-2.0/83e3feecff7f1690d6bcfc460cee14bc3f983676/index.html';
  try{
    const response=await fetch(previousUrl);
    if(!response.ok) throw new Error('Current game source unavailable');
    let html=await response.text();
    const marker='renderPalette();';
    const insertion=html.lastIndexOf(marker);
    if(insertion<0) throw new Error('Game extension point unavailable');
    const naoyaAdditions=`
CATALOG.special.push(
  make('naoya-zenin','Naoya Zenin','💨',18000,100000,1200,420,9,24)
);
const attackBeforeNaoya=attack;
attack=function(unit,target){
  if(unit.id!=='naoya-zenin') return attackBeforeNaoya(unit,target);
  const oldDamage=unit.dmg;
  if(unit.naoyaDashPhase==='in') unit.dmg=Math.min(1e9,oldDamage*2);
  try{return attackBeforeNaoya(unit,target);}
  finally{unit.dmg=oldDamage;}
};
const stepBeforeNaoya=step;
step=function(){
  if(running){
    for(const unit of units){
      if(unit.id!=='naoya-zenin'||unit.hp<=0) continue;
      unit.naoyaBaseSpeed=unit.naoyaBaseSpeed||unit.speed;
      unit.naoyaGrowthTimer=(unit.naoyaGrowthTimer||0)+1;
      if(unit.naoyaGrowthTimer>=60){
        unit.naoyaGrowthTimer=0;
        unit.naoyaBaseSpeed=Math.min(24,unit.naoyaBaseSpeed+.08);
      }
      unit.hp=Math.min(unit.maxHp,unit.hp+Math.max(1,unit.maxHp*.0008));
      unit.naoyaDashPhase=unit.naoyaDashPhase||'in';
      unit.naoyaDashTimer=(unit.naoyaDashTimer||0)+1;
      const phaseLength=unit.naoyaDashPhase==='in'?180:90;
      if(unit.naoyaDashTimer>=phaseLength){
        unit.naoyaDashTimer=0;
        unit.naoyaDashPhase=unit.naoyaDashPhase==='in'?'out':'in';
        spawnParticles(unit.x,unit.y,'#38bdf8',12,4,18);
      }
      unit.speed=unit.naoyaBaseSpeed+(unit.naoyaDashPhase==='in'?10:0);
      unit.naoyaTrail=unit.naoyaTrail||[];
    }
  }
  stepBeforeNaoya();
  if(running){
    for(const unit of units){
      if(unit.id!=='naoya-zenin'||unit.hp<=0) continue;
      if(unit.naoyaDashPhase==='out'){
        const target=nearest(units,unit.x,unit.y,other=>other.team!==unit.team&&other.hp>0);
        if(target){
          const dx=unit.x-target.x,dy=unit.y-target.y,distance=Math.hypot(dx,dy)||1;
          const retreat=unit.naoyaBaseSpeed+10;
          unit.x=Math.max(12,Math.min(W-12,unit.x+dx/distance*retreat));
          unit.y=Math.max(12,Math.min(H-12,unit.y+dy/distance*retreat));
        }
      }
      if((animTick||0)%2===0){
        unit.naoyaTrail.push({x:unit.x,y:unit.y});
        if(unit.naoyaTrail.length>20) unit.naoyaTrail.shift();
      }
    }
  }
};
const renderBeforeNaoya=render;
render=function(){
  renderBeforeNaoya();
  for(const unit of units){
    if(unit.id!=='naoya-zenin'||!unit.naoyaTrail||unit.naoyaTrail.length<2) continue;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(unit.naoyaTrail[0].x,unit.naoyaTrail[0].y);
    for(let i=1;i<unit.naoyaTrail.length;i++) ctx.lineTo(unit.naoyaTrail[i].x,unit.naoyaTrail[i].y);
    ctx.strokeStyle='rgba(56,189,248,.72)';
    ctx.lineWidth=Math.max(2,unit.size*.35);
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.shadowColor='#38bdf8';
    ctx.shadowBlur=14;
    ctx.stroke();
    ctx.restore();
  }
};
`;
    html=html.slice(0,insertion)+naoyaAdditions+html.slice(insertion);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('load-status').hidden=true;
    document.getElementById('load-error').hidden=false;
    console.error(error);
  }
})();
</script>
</body>
</html>
