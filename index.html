<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Battle Draw</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#1a1a1a;overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh}#topbar{min-height:54px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:#fff;z-index:1}.title{font-weight:800;font-size:19px;white-space:nowrap}.counts,.controls{display:flex;align-items:center;gap:8px}.counts{font-weight:700;font-size:14px}.blue-badge,.red-badge{padding:4px 9px;border-radius:999px}.blue-badge{color:#2563eb;background:#eff6ff}.red-badge{color:#dc2626;background:#fef2f2}button{font-family:inherit;font-weight:700;font-size:14px;border:1px solid #d1d5db;background:#fff;color:#111827;padding:7px 12px;border-radius:8px;cursor:pointer}button:hover{background:#f3f4f6}#battleBtn{background:#111827;color:#fff;border-color:#111827;min-width:76px}#battleBtn.running{background:#dc2626;border-color:#dc2626}#boxModeBtn.active{background:#dbeafe;border-color:#2563eb;color:#1d4ed8}#arena-wrap{flex:1;min-height:0;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}#winner-banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 20px;border-radius:999px;font-weight:800;display:none;pointer-events:none;white-space:nowrap}#dock{border-top:1px solid #e5e7eb;background:#fafafa;padding:8px 12px 10px}.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}.tab{padding:5px 13px;border-radius:999px;font-size:13px;border-color:transparent;background:transparent;color:#6b7280}.tab.active{background:#fff;color:#111827;border-color:#d1d5db}.palette{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;justify-content:flex-start}.unit-card{flex:0 0 auto;min-width:76px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}.unit-card.selected{border-color:#111827;background:#f3f4f6}.unit-icon{font-size:20px;line-height:1.1}.unit-name{font-size:11px;font-weight:700;color:#374151;white-space:nowrap}@media(min-width:900px){.palette{justify-content:center}}@media(max-width:600px){#topbar{padding:0 8px;gap:5px}.title{font-size:15px}.counts{font-size:12px;gap:4px}.blue-badge,.red-badge{padding:4px 6px}.controls{gap:4px}button{padding:6px 8px;font-size:12px}.tab{padding:5px 9px}}
</style>
</head>
<body>
<header id="topbar"><div class="title">⚔️ Battle Draw</div><div class="counts"><span class="blue-badge">BLUE: <span id="blueCount">0</span></span><span class="red-badge">RED: <span id="redCount">0</span></span></div><div class="controls"><button id="boxModeBtn" type="button" aria-pressed="false" title="Drag a rectangle to place a group">Box: Off</button><button id="battleBtn">Battle</button><button id="clearBtn">Clear</button></div></header>
<main id="arena-wrap"><canvas id="canvas"></canvas><div id="winner-banner"></div></main>
<footer id="dock"><nav class="tabs"><button class="tab active" data-cat="army">Army</button><button class="tab" data-cat="animals">Animals</button><button class="tab" data-cat="mythical">Mythical</button><button class="tab" data-cat="terrain">Terrain</button></nav><div class="palette" id="palette"></div></footer>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const battleBtn=document.getElementById('battleBtn'),clearBtn=document.getElementById('clearBtn'),boxModeBtn=document.getElementById('boxModeBtn'),blueCountEl=document.getElementById('blueCount'),redCountEl=document.getElementById('redCount'),winnerBanner=document.getElementById('winner-banner'),paletteEl=document.getElementById('palette');
const make=(id,name,icon,hp,dmg,range,speed,cd,size,extra={})=>({id,name,icon,hp,dmg,range,speed,cd,size,spacing:size*2+4,...extra});
const CATALOG={
 army:[make('soldier','Soldier','🗡️',100,14,22,1.45,38,12),make('flamethrower','Flamer','🔥',90,5,85,1.25,8,12,{flame:true}),make('sniper','Sniper','🎯',70,65,290,.9,110,11,{proj:'bullet'}),make('roman','Roman','🛡️',150,16,24,1.15,42,13),make('grenadier','Grenadier','💣',85,45,165,1.2,95,12,{proj:'grenade'}),make('archer','Archer','🏹',75,18,210,1.2,55,11,{proj:'arrow'}),make('cavalry','Cavalry','🐎',155,24,28,2.5,36,15),make('ninja','Ninja','🥷',80,22,24,2.35,22,11),make('tank','Tank','🚜',460,75,240,.75,120,20,{proj:'shell'}),make('medic','Medic','➕',85,15,120,1.35,45,11,{healer:true}),make('shield','Shielder','🧱',220,10,22,.95,50,13),make('mortar','Mortar','🧨',90,65,320,.55,140,14,{proj:'mortar'})],
 animals:[make('boar','Boar','🐗',115,20,22,2.1,35,12),make('gorilla','Gorilla','🦍',240,34,28,1.5,42,16),make('lion','Lion','🦁',165,28,25,2.2,32,14),make('bear','Bear','🐻',260,35,28,1.45,44,16),make('elephant','Elephant','🐘',450,52,34,1,55,21),make('wolf','Wolf','🐺',95,18,22,2.45,28,11),make('rhino','Rhino','🦏',340,45,30,1.85,48,18),make('croc','Crocodile','🐊',170,30,24,1.35,38,14),make('eagle','Eagle','🦅',85,20,24,2.7,28,12,{flying:true}),make('tiger','Tiger','🐅',175,31,25,2.3,30,14)],
 mythical:[make('dragon','Dragon','🐉',480,10,135,1.65,7,21,{flame:true,flying:true}),make('giant','Giant','👹',520,60,36,.9,60,22),make('wizard','Wizard','🧙',95,38,195,1.15,68,12,{proj:'fireball'}),make('skeleton','Skeleton','💀',65,13,21,1.65,32,11),make('phoenix','Phoenix','🔥',220,8,110,2.2,8,16,{flame:true,flying:true,reborn:true}),make('griffin','Griffin','🦁',260,34,28,2.3,34,17,{flying:true}),make('golem','Golem','🗿',580,55,32,.65,65,21),make('necromancer','Necro','🧛',110,24,180,1.1,85,12,{proj:'orb',summoner:true}),make('kraken','Kraken','🐙',440,44,48,.95,45,20)],
 terrain:[{id:'tree',name:'Tree',icon:'🌲',terrain:true,hp:90,size:16,spacing:34,flammable:true},{id:'rock',name:'Boulder',icon:'🪨',terrain:true,hp:9999,size:18,spacing:38,solid:true},{id:'barrel',name:'Oil Barrel',icon:'🛢️',terrain:true,hp:25,size:12,spacing:30,explosive:true},{id:'lava',name:'Lava',icon:'🌋',terrain:true,hp:9999,size:20,spacing:32,hazard:'lava'},{id:'mud',name:'Mud',icon:'🟤',terrain:true,hp:9999,size:22,spacing:34,hazard:'mud'},{id:'mine',name:'Landmine',icon:'💥',terrain:true,hp:10,size:9,spacing:28,mine:true},{id:'spikes',name:'Spikes',icon:'📌',terrain:true,hp:140,size:15,spacing:30,hazard:'spikes'},{id:'ice',name:'Ice Patch',icon:'🧊',terrain:true,hp:9999,size:22,spacing:34,hazard:'ice'}]
};
let W=0,H=0,dpr=1,currentCat='army',selectedItem=CATALOG.army[0],units=[],terrains=[],projectiles=[],particles=[],running=false,animTick=0,isDrawing=false,lastPlacePos=null,boxMode=false,boxStart=null,boxEnd=null;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.max(1,window.devicePixelRatio||1);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function renderPalette(){paletteEl.replaceChildren();for(const item of CATALOG[currentCat]){const card=document.createElement('button');card.type='button';card.className='unit-card'+(selectedItem.id===item.id?' selected':'');card.innerHTML=`<span class="unit-icon">${item.icon}</span><span class="unit-name">${item.name}</span>`;card.onclick=()=>{selectedItem=item;renderPalette()};paletteEl.appendChild(card)}}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');currentCat=tab.dataset.cat;selectedItem=CATALOG[currentCat][0];renderPalette()}));renderPalette();
boxModeBtn.addEventListener('click',()=>{boxMode=!boxMode;boxModeBtn.classList.toggle('active',boxMode);boxModeBtn.setAttribute('aria-pressed',String(boxMode));boxModeBtn.textContent=boxMode?'Box: On':'Box: Off';boxStart=boxEnd=null;lastPlacePos=null});
function coords(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function spawnAt(x,y){if(running||x<16||x>W-16||y<16||y>H-16)return false;if(selectedItem.terrain)terrains.push({...selectedItem,x,y,maxHp:selectedItem.hp,burning:0});else{const team=x<W/2?'blue':'red';units.push({...selectedItem,team,x,y,vx:0,vy:0,maxHp:selectedItem.hp,cooldown:Math.random()*20,phase:Math.random()*Math.PI*2,attackAnim:0,facing:team==='blue'?1:-1,burning:0,rebornUsed:false})}return true}
function trySpawn(x,y){if(running)return;if(lastPlacePos&&Math.hypot(x-lastPlacePos.x,y-lastPlacePos.y)<selectedItem.spacing)return;if(spawnAt(x,y))lastPlacePos={x,y};updateCounts()}
function placeBox(a,b){if(running)return;const left=Math.max(16,Math.min(a.x,b.x)),right=Math.min(W-16,Math.max(a.x,b.x)),top=Math.max(16,Math.min(a.y,b.y)),bottom=Math.min(H-16,Math.max(a.y,b.y)),step=Math.max(12,selectedItem.spacing);let placed=0;for(let y=top;y<=bottom+0.01;y+=step){for(let x=left;x<=right+0.01;x+=step){if(spawnAt(x,y))placed++}}if(placed===0&&Math.hypot(b.x-a.x,b.y-a.y)<step)spawnAt((a.x+b.x)/2,(a.y+b.y)/2);updateCounts()}
canvas.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;isDrawing=true;lastPlacePos=null;canvas.setPointerCapture?.(e.pointerId);const p=coords(e);if(boxMode){boxStart=p;boxEnd=p}else trySpawn(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!isDrawing)return;const p=coords(e);if(boxMode)boxEnd=p;else trySpawn(p.x,p.y)});function finishPlacement(){if(!isDrawing)return;isDrawing=false;if(boxMode&&boxStart&&boxEnd)placeBox(boxStart,boxEnd);boxStart=boxEnd=null}canvas.addEventListener('pointerup',finishPlacement);canvas.addEventListener('pointercancel',finishPlacement);
function setStopped(){running=false;battleBtn.textContent='Battle';battleBtn.classList.remove('running')}
battleBtn.onclick=()=>{if(running){setStopped();return}if(!units.some(u=>u.team==='blue')||!units.some(u=>u.team==='red'))return;running=true;battleBtn.textContent='Stop';battleBtn.classList.add('running');winnerBanner.style.display='none'};
clearBtn.onclick=()=>{setStopped();units=[];terrains=[];projectiles=[];particles=[];winnerBanner.style.display='none';updateCounts()};
function updateCounts(){const blue=units.filter(u=>u.team==='blue').length,red=units.filter(u=>u.team==='red').length;blueCountEl.textContent=blue;redCountEl.textContent=red;if(running&&(!blue||!red)){setStopped();winnerBanner.textContent=blue&&red===0?'🔵 Blue Team Wins!':red&&blue===0?'🔴 Red Team Wins!':'Draw! Everyone fell.';winnerBanner.style.display='block'}}
function spawnParticles(x,y,color,count,speed=3,life=24){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*speed;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,color,life:life*(.6+Math.random()*.6),maxLife:life,size:2+Math.random()*3})}}
function explode(x,y,radius,damage){spawnParticles(x,y,'#f97316',18,5,28);spawnParticles(x,y,'#ef4444',12,3,24);for(const u of units){const d=Math.hypot(u.x-x,u.y-y);if(d<radius){const f=1-d/radius;u.hp-=damage*f;const a=Math.atan2(u.y-y,u.x-x);u.vx+=Math.cos(a)*6*f;u.vy+=Math.sin(a)*6*f}}for(const t of terrains){const d=Math.hypot(t.x-x,t.y-y);if(d<radius){if(t.flammable)t.burning=180;if(t.explosive&&d>2){t.hp=0;setTimeout(()=>explode(t.x,t.y,95,100),50)}}}}
const projectileStats={bullet:[11,32,'#111827',0,false],arrow:[6.5,38,'#78350f',0,false],grenade:[4.2,42,'#15803d',58,true],shell:[7.5,36,'#1f2937',68,false],mortar:[4.5,70,'#111827',80,true],fireball:[5.5,40,'#ea580c',42,false],orb:[5,42,'#7e22ce',0,false]};
function step(){animTick++;for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.94;p.vy*=.94;if(--p.life<=0)particles.splice(i,1)}if(!running)return;
for(let i=terrains.length-1;i>=0;i--){const t=terrains[i];if(t.burning>0){t.burning--;t.hp-=.35;if(Math.random()<.25)spawnParticles(t.x,t.y-6,'#f97316',1,1,15);for(const u of units)if(Math.hypot(u.x-t.x,u.y-t.y)<26)u.burning=Math.max(u.burning,50)}if(t.hp<=0)terrains.splice(i,1)}
for(let i=projectiles.length-1;i>=0;i--){const p=projectiles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.arc)p.z=Math.sin((1-p.life/p.maxLife)*Math.PI)*45;let hit=false;if(!p.arc||p.life<=2){for(const u of units){if(u.team!==p.team&&Math.hypot(u.x-p.x,u.y-p.y)<u.size+6){if(p.aoe)explode(p.x,p.y,p.aoe,p.dmg);else{u.hp-=p.dmg;if(p.burn)u.burning=90;spawnParticles(p.x,p.y,p.color,4,2,14)}hit=true;break}}if(!hit&&!p.arc){for(const t of terrains){if(t.solid&&Math.hypot(t.x-p.x,t.y-p.y)<t.size){hit=true;break}if(t.explosive&&Math.hypot(t.x-p.x,t.y-p.y)<t.size+5){t.hp=0;explode(t.x,t.y,95,120);hit=true;break}}}}if(hit||p.life<=0){if(p.aoe&&!hit)explode(p.x,p.y,p.aoe,p.dmg);projectiles.splice(i,1)}}
for(let i=0;i<units.length;i++){const u=units[i];if(u.cooldown>0)u.cooldown--;if(u.attackAnim>0)u.attackAnim--;if(u.burning>0){u.burning--;u.hp-=.22}let speedMult=1;for(const t of terrains){if(Math.hypot(u.x-t.x,u.y-t.y)<u.size+t.size){if(t.solid&&!u.flying){const a=Math.atan2(u.y-t.y,u.x-t.x);u.x+=Math.cos(a)*2;u.y+=Math.sin(a)*2}else if(t.hazard==='lava'&&!u.flying){u.hp-=.7;u.burning=50}else if(t.hazard==='mud'&&!u.flying)speedMult=.45;else if(t.hazard==='ice'&&!u.flying)speedMult=1.45;else if(t.hazard==='spikes'&&!u.flying)u.hp-=.35;else if(t.mine&&!u.flying){t.hp=0;explode(t.x,t.y,70,95)}}}
let target=null,best=Infinity;if(u.healer)for(const a of units)if(a!==u&&a.team===u.team&&a.hp<a.maxHp){const d=Math.hypot(a.x-u.x,a.y-u.y);if(d<best){best=d;target=a}}if(!target)for(const o of units)if(o.team!==u.team){const d=Math.hypot(o.x-u.x,o.y-u.y);if(d<best){best=d;target=o}}
if(target){const dx=target.x-u.x,dy=target.y-u.y,d=Math.hypot(dx,dy);if(dx)u.facing=dx>0?1:-1;if(d>u.range){if(d){u.vx+=dx/d*u.speed*speedMult*.25;u.vy+=dy/d*u.speed*speedMult*.25}u.phase+=.22*u.speed}else if(u.cooldown<=0){u.cooldown=u.cd;u.attackAnim=12;const a=Math.atan2(dy,dx);if(u.healer&&target.team===u.team){target.hp=Math.min(target.maxHp,target.hp+u.dmg);spawnParticles(target.x,target.y,'#22c55e',5,1.5,18)}else if(u.flame){for(const en of units)if(en.team!==u.team&&Math.hypot(en.x-u.x,en.y-u.y)<u.range){const a2=Math.atan2(en.y-u.y,en.x-u.x);if(Math.abs(Math.atan2(Math.sin(a2-a),Math.cos(a2-a)))<.55){en.hp-=u.dmg;en.burning=45}}for(const t of terrains)if(Math.hypot(t.x-u.x,t.y-u.y)<u.range){if(t.flammable)t.burning=180;if(t.explosive){t.hp=0;explode(t.x,t.y,95,120)}}}else if(u.proj){const s=projectileStats[u.proj];projectiles.push({x:u.x,y:u.y,z:0,vx:Math.cos(a)*s[0],vy:Math.sin(a)*s[0],life:s[1],maxLife:s[1],team:u.team,dmg:u.dmg,color:s[2],aoe:s[3],arc:s[4],burn:u.proj==='fireball'});if(u.summoner&&Math.random()<.35&&units.length<260){const sk=CATALOG.mythical.find(x=>x.id==='skeleton');units.push({...sk,team:u.team,x:u.x+Math.random()*20-10,y:u.y+Math.random()*20-10,vx:0,vy:0,maxHp:sk.hp,cooldown:20,phase:0,attackAnim:0,facing:u.facing,burning:0})}}else{target.hp-=u.dmg;target.vx+=Math.cos(a)*2;target.vy+=Math.sin(a)*2;spawnParticles(target.x,target.y,u.team==='blue'?'#3b82f6':'#ef4444',3,2,12)}}}
u.x+=u.vx;u.y+=u.vy;u.vx*=.78;u.vy*=.78;u.x=Math.max(u.size,Math.min(W-u.size,u.x));u.y=Math.max(u.size,Math.min(H-u.size,u.y))}
let died=false;for(let i=units.length-1;i>=0;i--){const u=units[i];if(u.hp<=0){if(u.reborn&&!u.rebornUsed){u.rebornUsed=true;u.hp=u.maxHp*.75;spawnParticles(u.x,u.y,'#f59e0b',20,4,26)}else{spawnParticles(u.x,u.y,u.team==='blue'?'#2563eb':'#dc2626',8,3,20);units.splice(i,1);died=true}}}if(died)updateCounts()}
function drawTerrain(t){ctx.save();ctx.translate(t.x,t.y);ctx.font=`${Math.max(18,t.size*1.6)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.icon,0,0);ctx.restore()}
function drawUnit(u){const c=u.team==='blue'?'#2563eb':'#dc2626',hover=u.flying?Math.sin(animTick*.14+u.phase)*4-6:0;ctx.save();ctx.translate(u.x,u.y);ctx.fillStyle='rgba(0,0,0,.13)';ctx.beginPath();ctx.ellipse(0,u.size*.8,u.size*.8,u.size*.3,0,0,Math.PI*2);ctx.fill();ctx.translate(0,hover);ctx.fillStyle=c;ctx.beginPath();ctx.arc(0,0,u.size,0,Math.PI*2);ctx.fill();ctx.font=`${u.size*1.35}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(u.icon,0,1);ctx.restore();if(u.hp<u.maxHp){const w=Math.max(18,u.size*1.7),x=u.x-w/2,y=u.y-u.size-10+hover;ctx.fillStyle='#d1d5db';ctx.fillRect(x,y,w,3);ctx.fillStyle=c;ctx.fillRect(x,y,w*Math.max(0,u.hp/u.maxHp),3)}}
function render(){ctx.clearRect(0,0,W,H);ctx.strokeStyle=running?'rgba(209,213,219,.45)':'#d1d5db';ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);if(!running&&!units.length&&!terrains.length){ctx.font='700 14px sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(37,99,235,.55)';ctx.fillText('← Draw Blue Army Here',W*.25,H*.5);ctx.fillStyle='rgba(220,38,38,.55)';ctx.fillText('Draw Red Army Here →',W*.75,H*.5)}if(boxMode&&boxStart&&boxEnd){const x=Math.min(boxStart.x,boxEnd.x),y=Math.min(boxStart.y,boxEnd.y),w=Math.abs(boxEnd.x-boxStart.x),h=Math.abs(boxEnd.y-boxStart.y);ctx.fillStyle='rgba(37,99,235,.12)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='#2563eb';ctx.lineWidth=1.5;ctx.setLineDash([5,4]);ctx.strokeRect(x,y,w,h);ctx.setLineDash([])}terrains.forEach(drawTerrain);units.slice().sort((a,b)=>a.y-b.y).forEach(drawUnit);for(const p of projectiles){ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y-(p.z||0),p.aoe?4.5:3,0,Math.PI*2);ctx.fill()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/p.maxLife);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function loop(){step();render();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
