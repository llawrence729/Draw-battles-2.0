<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Battle Draw</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#fff;color:#1a1a1a;overflow:hidden;display:flex;flex-direction:column;height:100vh;height:100dvh}#topbar{min-height:54px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:#fff;z-index:1}.title{font-weight:800;font-size:19px;white-space:nowrap}.counts,.controls{display:flex;align-items:center;gap:8px}.counts{font-weight:700;font-size:14px}.blue-badge,.red-badge{padding:4px 9px;border-radius:999px}.blue-badge{color:#2563eb;background:#eff6ff}.red-badge{color:#dc2626;background:#fef2f2}button{font-family:inherit;font-weight:700;font-size:14px;border:1px solid #d1d5db;background:#fff;color:#111827;padding:7px 12px;border-radius:8px;cursor:pointer}button:hover{background:#f3f4f6}#battleBtn{background:#111827;color:#fff;border-color:#111827;min-width:76px}#battleBtn.running{background:#dc2626;border-color:#dc2626}#arena-wrap{flex:1;min-height:0;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}#winner-banner{position:absolute;top:18px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 20px;border-radius:999px;font-weight:800;display:none;pointer-events:none;white-space:nowrap}#dock{border-top:1px solid #e5e7eb;background:#fafafa;padding:8px 12px 10px}.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}.tab{padding:5px 13px;border-radius:999px;font-size:13px;border-color:transparent;background:transparent;color:#6b7280}.tab.active{background:#fff;color:#111827;border-color:#d1d5db}.palette{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;justify-content:flex-start}.unit-card{flex:0 0 auto;min-width:76px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px}.unit-card.selected{border-color:#111827;background:#f3f4f6}.unit-icon{font-size:20px;line-height:1.1}.unit-name{font-size:11px;font-weight:700;color:#374151;white-space:nowrap}@media(min-width:900px){.palette{justify-content:center}}@media(max-width:600px){#topbar{padding:0 8px;gap:5px}.title{font-size:15px}.counts{font-size:12px;gap:4px}.blue-badge,.red-badge{padding:4px 6px}.controls{gap:4px}button{padding:6px 8px;font-size:12px}.tab{padding:5px 9px}}
</style>
</head>
<body>
<header id="topbar"><div class="title">⚔️ Battle Draw</div><div class="counts"><span class="blue-badge">BLUE: <span id="blueCount">0</span></span><span class="red-badge">RED: <span id="redCount">0</span></span></div><div class="controls"><button id="battleBtn">Battle</button><button id="clearBtn">Clear</button></div></header>
<main id="arena-wrap"><canvas id="canvas"></canvas><div id="winner-banner"></div></main>
<footer id="dock"><nav class="tabs"><button class="tab active" data-cat="army">Army</button><button class="tab" data-cat="animals">Animals</button><button class="tab" data-cat="mythical">Mythical</button><button class="tab" data-cat="terrain">Terrain</button></nav><div class="palette" id="palette"></div></footer>
<script>
'use strict';
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const battleBtn=document.getElementById('battleBtn'),clearBtn=document.getElementById('clearBtn'),blueCountEl=document.getElementById('blueCount'),redCountEl=document.getElementById('redCount'),winnerBanner=document.getElementById('winner-banner'),paletteEl=document.getElementById('palette');
const make=(id,name,icon,hp,dmg,range,speed,cd,size,extra={})=>({id,name,icon,hp,dmg,range,speed,cd,size,spacing:size*2+4,...extra});
const CATALOG={
 army:[make('soldier','Soldier','🗡️',100,14,22,1.45,38,12),make('flamethrower','Flamer','🔥',90,5,85,1.25,8,12,{flame:true}),make('sniper','Sniper','🎯',70,25,220,.9,70,11),make('roman','Roman','🛡️',150,16,24,1.15,42,13),make('archer','Archer','🏹',75,18,150,1.2,55,11),make('darsh','Darsh','🇮🇳',180,12,70,1.2,30,15,{aura:true})],
 animals:[make('boar','Boar','🐗',115,20,22,2.1,35,12),make('gorilla','Gorilla','🦍',240,34,28,1.5,42,16),make('lion','Lion','🦁',165,28,25,2.2,32,14),make('bear','Bear','🐻',260,35,28,1.4,44,16)],
 mythical:[make('dragon','Dragon','🐉',300,14,90,1.5,24,19,{flame:true}),make('giant','Giant','👹',360,40,30,.9,55,21),make('wizard','Wizard','🧙',95,24,160,1.15,55,12)],
 terrain:[]
};
let W=0,H=0,dpr=1,currentCat='army',selectedItem=CATALOG.army[0],units=[],running=false,animTick=0,lastPlacePos=null;
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.max(1,window.devicePixelRatio||1);W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}window.addEventListener('resize',resize);resize();
function renderPalette(){paletteEl.replaceChildren();for(const item of CATALOG[currentCat]){const card=document.createElement('button');card.type='button';card.className='unit-card'+(selectedItem.id===item.id?' selected':'');card.innerHTML=`<span class="unit-icon">${item.icon}</span><span class="unit-name">${item.name}</span>`;card.onclick=()=>{selectedItem=item;renderPalette()};paletteEl.appendChild(card)}}
document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');currentCat=tab.dataset.cat;selectedItem=CATALOG[currentCat][0];renderPalette()}));renderPalette();
function coords(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function spawnAt(x,y){if(running||x<16||x>W-16||y<16||y>H-16)return false;const team=x<W/2?'blue':'red';units.push({...selectedItem,team,x,y,vx:0,vy:0,maxHp:selectedItem.hp,cooldown:Math.random()*20,phase:Math.random()*Math.PI*2});updateCounts();return true}
canvas.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;lastPlacePos=null;canvas.setPointerCapture?.(e.pointerId);const p=coords(e);if(spawnAt(p.x,p.y))lastPlacePos=p});canvas.addEventListener('pointermove',e=>{if(!(e.buttons&1)||running)return;const p=coords(e);if(!lastPlacePos||Math.hypot(p.x-lastPlacePos.x,p.y-lastPlacePos.y)>=selectedItem.spacing){if(spawnAt(p.x,p.y))lastPlacePos=p}});canvas.addEventListener('pointerup',()=>lastPlacePos=null);canvas.addEventListener('pointercancel',()=>lastPlacePos=null);
function stopBattle(){running=false;battleBtn.textContent='Battle';battleBtn.classList.remove('running')}
battleBtn.onclick=()=>{if(running){stopBattle();return}if(!units.some(u=>u.team==='blue')||!units.some(u=>u.team==='red'))return;running=true;battleBtn.textContent='Stop';battleBtn.classList.add('running');winnerBanner.style.display='none'};
clearBtn.onclick=()=>{stopBattle();units=[];winnerBanner.style.display='none';updateCounts()};
function updateCounts(){const blue=units.filter(u=>u.team==='blue').length,red=units.filter(u=>u.team==='red').length;blueCountEl.textContent=blue;redCountEl.textContent=red;if(running&&(!blue||!red)){stopBattle();winnerBanner.textContent=blue?'🔵 Blue Team Wins!':'🔴 Red Team Wins!';winnerBanner.style.display='block'}}
function particles(x,y,color,n=5){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=Math.random()*2.5;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x+Math.cos(a)*s*3,y+Math.sin(a)*s*3,1.5,0,Math.PI*2);ctx.fill()}}
function step(){animTick++;if(!running)return;for(const u of units){if(u.cooldown>0)u.cooldown--;if(u.aura&&animTick%30===0){for(const enemy of units){const d=Math.hypot(enemy.x-u.x,enemy.y-u.y);if(enemy.team!==u.team&&d<68){enemy.hp-=u.dmg;particles(enemy.x,enemy.y,'#22c55e',3)}}}let target=null,best=Infinity;for(const o of units)if(o.team!==u.team){const d=Math.hypot(o.x-u.x,o.y-u.y);if(d<best){best=d;target=o}}if(!target)continue;const dx=target.x-u.x,dy=target.y-u.y,d=Math.max(1,Math.hypot(dx,dy));if(d>u.range){u.vx+=dx/d*u.speed*.22;u.vy+=dy/d*u.speed*.22}else if(u.cooldown<=0){u.cooldown=u.cd;target.hp-=u.dmg;particles(target.x,target.y,u.team==='blue'?'#2563eb':'#dc2626',5);if(u.flame)for(const e of units)if(e.team!==u.team&&Math.hypot(e.x-u.x,e.y-u.y)<u.range)e.hp-=u.dmg*.25}u.x=Math.max(u.size,Math.min(W-u.size,u.x+u.vx));u.y=Math.max(u.size,Math.min(H-u.size,u.y+u.vy));u.vx*=.78;u.vy*=.78}units=units.filter(u=>u.hp>0);updateCounts()}
function drawDarshFlag(u){const w=u.size*2.15,h=u.size*1.35,x=-w/2,y=-h/2;ctx.fillStyle='#ff9933';ctx.fillRect(x,y,w,h/3);ctx.fillStyle='#fff';ctx.fillRect(x,y+h/3,w,h/3);ctx.fillStyle='#138808';ctx.fillRect(x,y+2*h/3,w,h/3);ctx.strokeStyle='#1d4ed8';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,0,h*.14,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-h*.14,0);ctx.lineTo(h*.14,0);ctx.moveTo(0,-h*.14);ctx.lineTo(0,h*.14);ctx.stroke();ctx.strokeStyle='#64748b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-2,y-2);ctx.lineTo(x-2,y+h+2);ctx.stroke()}
function drawUnit(u){const teamColor=u.team==='blue'?'#2563eb':'#dc2626';ctx.save();ctx.translate(u.x,u.y);if(u.aura){const pulse=68+Math.sin(animTick*.12+u.phase)*4;ctx.beginPath();ctx.arc(0,0,pulse,0,Math.PI*2);ctx.fillStyle='rgba(34,197,94,.12)';ctx.fill();ctx.strokeStyle='rgba(22,163,74,.62)';ctx.lineWidth=2;ctx.stroke();ctx.shadowColor='#22c55e';ctx.shadowBlur=14}ctx.fillStyle='rgba(0,0,0,.13)';ctx.beginPath();ctx.ellipse(0,u.size*.8,u.size*.8,u.size*.3,0,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle=teamColor;ctx.beginPath();ctx.arc(0,0,u.size,0,Math.PI*2);ctx.fill();if(u.aura)drawDarshFlag(u);else{ctx.font=`${u.size*1.35}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(u.icon,0,1)}ctx.restore();if(u.hp<u.maxHp){const w=Math.max(18,u.size*1.7),x=u.x-w/2,y=u.y-u.size-10;ctx.fillStyle='#d1d5db';ctx.fillRect(x,y,w,3);ctx.fillStyle=teamColor;ctx.fillRect(x,y,w*Math.max(0,u.hp/u.maxHp),3)}}
function render(){ctx.clearRect(0,0,W,H);ctx.strokeStyle=running?'rgba(209,213,219,.45)':'#d1d5db';ctx.lineWidth=2;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);if(!running&&!units.length){ctx.font='700 14px sans-serif';ctx.textAlign='center';ctx.fillStyle='rgba(37,99,235,.55)';ctx.fillText('← Draw Blue Army Here',W*.25,H*.5);ctx.fillStyle='rgba(220,38,38,.55)';ctx.fillText('Draw Red Army Here →',W*.75,H*.5)}units.slice().sort((a,b)=>a.y-b.y).forEach(drawUnit)}
function loop(){step();render();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
