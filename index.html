<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Draw</title>
<style>body{font-family:system-ui,sans-serif;margin:2rem;color:#1a1a1a}#load-error{color:#b91c1c}</style>
</head>
<body>
<p id="load-status">Loading Battle Draw…</p>
<p id="load-error" hidden>Battle Draw could not be loaded. Please check your internet connection and reload.</p>
<script>
(async()=>{
  const sourceUrl='https://raw.githubusercontent.com/llawrence729/Draw-battles-2.0/579d66a292ca906b9b0a13d53392dde400e2e201/index.html';
  try{
    const response=await fetch(sourceUrl);
    if(!response.ok) throw new Error('Current game source unavailable');
    let html=await response.text();
    const marker='renderPalette();';
    const insertion=html.lastIndexOf(marker);
    if(insertion<0) throw new Error('Game extension point unavailable');
    const additions=`
CATALOG.special.push(
  make('awakened-darsh','Awakened Darsh','⚡',5000,115,72,2.2,70,19)
);
const originalAttack=attack;
attack=function(unit,target){
  if(unit.id!=='awakened-darsh'||Math.random()>=.10){
    return originalAttack(unit,target);
  }
  const regularDamage=unit.dmg;
  unit.dmg=regularDamage*2;
  unit.blackFlashUntil=animTick+60;
  window.blackFlashUntil=animTick+60;
  try{return originalAttack(unit,target);}
  finally{unit.dmg=regularDamage;}
};
const previousStep=step;
step=function(){
  if(running){
    for(const unit of units){
      if(unit.id!=='awakened-darsh'||unit.hp<=0) continue;
      unit.powerUpTimer=(unit.powerUpTimer||0)+1;
      if(unit.powerUpTimer>=60){
        unit.powerUpTimer=0;
        unit.dmg+=2;
        unit.speed=Math.min(5.5,unit.speed+.025);
        unit.maxHp+=75;
        unit.hp=Math.min(unit.maxHp,unit.hp+75);
        unit.healthLevel=(unit.healthLevel||0)+1;
        unit.teleportInterval=Math.max(120,600-unit.healthLevel*12);
      }
      unit.hp=Math.min(unit.maxHp,unit.hp+.18);
      unit.awakenedTeleport=(unit.awakenedTeleport??600)-1;
      if(unit.awakenedTeleport<=0){
        unit.x=12+Math.random()*Math.max(1,W-24);
        unit.y=12+Math.random()*Math.max(1,H-24);
        unit.awakenedTeleport=unit.teleportInterval||600;
        spawnParticles(unit.x,unit.y,'#a855f7',24,6,28);
      }
    }
  }
  previousStep();
};
const renderBeforeBlackFlash=render;
render=function(){
  renderBeforeBlackFlash();
  for(const unit of units){
    if(unit.id!=='awakened-darsh'||unit.blackFlashUntil<=animTick) continue;
    ctx.save();
    ctx.beginPath();
    ctx.arc(unit.x,unit.y,unit.size+8,0,Math.PI*2);
    ctx.fillStyle='rgba(0,0,0,.78)';
    ctx.fill();
    ctx.strokeStyle='#ef2222';
    ctx.lineWidth=4;
    ctx.stroke();
    ctx.restore();
  }
  if(window.blackFlashUntil>animTick){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,.72)';
    ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.font='900 48px system-ui,sans-serif';
    ctx.lineWidth=5;
    ctx.strokeStyle='#dc2626';
    ctx.strokeText('BLACK FLASH',W/2,H/2);
    ctx.fillStyle='#fff';
    ctx.fillText('BLACK FLASH',W/2,H/2);
    ctx.restore();
  }
};
`;
    html=html.slice(0,insertion)+additions+html.slice(insertion);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('load-status').hidden=true;
    document.getElementById('load-error').hidden=false;
    console.error(error);
  }
})();
</script>
</body>
</html>
